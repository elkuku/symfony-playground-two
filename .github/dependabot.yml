version: 2

# One weekly PR for all Composer and GitHub Actions updates.
multi-ecosystem-groups:
    dependencies:
        schedule:
            interval: weekly

updates:
    # Keeps the SHA-pinned actions in .github/workflows up to date.
    - package-ecosystem: github-actions
      directory: /
      patterns: ['*']
      multi-ecosystem-group: dependencies

    - package-ecosystem: composer
      directory: /
      patterns: ['*']
      multi-ecosystem-group: dependencies
